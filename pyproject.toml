[project]
name = "sentinel"
version = "0.1.0"
description = "Phase 0 foundation for the Sentinel personal agentic trading system."
readme = "SPEC.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pydantic-settings",
    "textual>=0.60",
    "typer",
    "python-ulid",
    "rich",
    "tomli-w",
    "pandas>=3.0.3",
    "numpy>=2.5.1",
    "pyarrow>=24.0.0",
    "yfinance>=1.5.1",
    "pandas-datareader>=0.11.1",
    "httpx>=0.28.1",
    "anthropic>=0.116.0",
    "openai>=2.44.0",
    "textual-plotext>=1.0.1",
    "python-dateutil>=2.9.0.post0",
    "croniter>=6.2.3",
]

[project.scripts]
sentinel = "sentinel.__main__:main"

[project.optional-dependencies]
robinhood = ["cryptography>=43"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-socket",
    "ruff",
    "pyright",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
include = ["sentinel"]
strict = ["sentinel/risk", "sentinel/execution"]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
