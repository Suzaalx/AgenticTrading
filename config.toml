[llm]
provider = "anthropic"
deep_model = "claude-sonnet-5"
quick_model = "claude-haiku-4-5-20251001"
role_models = {}
temperature = 0.0
max_retries = 3
monthly_budget_usd = 25.0

[pipeline]
max_debate_rounds = 2
max_risk_discuss_rounds = 1
always_run_risk_debate = false
depth_presets = { fast = 1, standard = 2, deep = 3 }

[data]
alpha_vantage_key_env = "ALPHA_VANTAGE_KEY"
finnhub_key_env = "FINNHUB_KEY"
news_limit = 20
news_lookback_days = 7

[execution]
slippage_bps = 5
commission_usd = 0.0
starting_cash_usd = 10000.0

[schedule]
enabled = false
decision_cron = "30 9 * * 1-5"
watchlist = ["NVDA","AAPL","SPY"]

[monitor]
equity_interval_min = 5
crypto_interval_min = 15
