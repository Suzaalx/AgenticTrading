[llm]
# provider: groq | gemini | ollama | anthropic | openai | openai_compatible
# Free / open-weight backends are the default; Anthropic stays selectable but is opt-in.
# Keys come from .env only (GROQ_API_KEY, GEMINI_API_KEY, ANTHROPIC_API_KEY, ...).
provider = "groq"
deep_model = "llama-3.3-70b-versatile"
quick_model = "llama-3.1-8b-instant"
role_models = { trader = "llama-3.3-70b-versatile", portfolio_manager = "llama-3.3-70b-versatile", research_manager = "llama-3.3-70b-versatile" }
temperature = 0.0
max_tokens = 4096
max_retries = 3
monthly_budget_usd = 15.0

# Per-provider overrides (all optional). Built-in defaults:
#   groq   -> https://api.groq.com/openai/v1                       key: GROQ_API_KEY
#   gemini -> https://generativelanguage.googleapis.com/v1beta/openai/  key: GEMINI_API_KEY
#   ollama -> http://localhost:11434/v1 (or OLLAMA_BASE_URL)         key: none needed
# Example open-weight model names per provider:
#   groq:   llama-3.3-70b-versatile, llama-3.1-8b-instant, qwen/qwen3-32b, openai/gpt-oss-120b
#   gemini: gemma-3-27b-it (open-weight), gemini-2.5-flash (free tier, not open-weight)
#   ollama: llama3.1, qwen3, phi4, gemma3
[llm.providers.ollama]
base_url = "http://localhost:11434/v1"

[pipeline]
# debate_enabled = false skips the bull/bear research debate (ablation); analyst reports are
# rolled up deterministically and handed straight to the trader. Recorded on each run row.
debate_enabled = true
max_debate_rounds = 2
max_risk_discuss_rounds = 1
always_run_risk_debate = false
depth_presets = { fast = 1, standard = 2, deep = 3 }

[data]
alpha_vantage_key_env = "ALPHA_VANTAGE_KEY"
finnhub_key_env = "FINNHUB_KEY"
news_limit = 20
news_lookback_days = 7

[execution]
slippage_bps = 5
commission_usd = 0.0
starting_cash_usd = 10000.0

[execution.robinhood]
enabled = false
crypto_only = true

[execution.robinhood_agentic]
enabled = false
mcp_endpoint_env = "RH_AGENTIC_MCP_URL"
mcp_token_env = "RH_AGENTIC_MCP_TOKEN"
agentic_account_number = ""
use_claude_bridge = true

[options]
enabled = false
commission_per_contract_usd = 0.65
slippage_half_spread_frac = 0.25
force_close_dte = 1
default_risk_free_rate = 0.04

[backtest.options]
iv_premium_factor = 1.1
synthetic_half_spread_pct = 2.0

[live]
live_order_ttl_minutes = 30
marketable_limit_buffer_bps = 10
reconcile_interval_min = 5

[schedule]
enabled = false
decision_cron = "30 9 * * 1-5"
watchlist = ["SPY","NVDA"]

[monitor]
equity_interval_min = 5
crypto_interval_min = 15
